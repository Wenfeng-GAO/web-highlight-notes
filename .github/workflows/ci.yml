name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # e2e drives the toolbar shortcut and the native permission dialog with real X input.
      - run: sudo apt-get update && sudo apt-get install -y xdotool
      - run: xvfb-run npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-artifacts
          path: |
            artifacts/
            test-results/
            playwright-report/
