<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>web-highlight-notes</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div class="app" data-mode="page">
      <header class="header">
        <div class="header-row">
          <h1 id="title" class="title" data-i18n="panelLoading"></h1>
          <button id="export" type="button" data-i18n="panelExport"></button>
        </div>
        <p id="counts" class="meta"></p>
        <p id="status" class="status" hidden><span data-i18n="panelNeedClick"></span> <a href="#" id="grant" role="button" data-i18n="panelGrant"></a></p>
      </header>
      <div id="notice" class="notice" role="note" hidden>
        <p class="notice-title" data-i18n="panelFileAccessTitle"></p>
        <p class="notice-body" data-i18n="panelFileAccessBody"></p>
        <button id="open-settings" type="button" class="notice-button" data-i18n="panelFileAccessButton"></button>
      </div>
      <textarea id="summary" class="summary" data-i18n-placeholder="panelSummaryPlaceholder"></textarea>
      <ul id="list" class="list"></ul>
    </div>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
