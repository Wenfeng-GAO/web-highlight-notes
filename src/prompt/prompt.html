<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="prompt.css" />
  </head>
  <body>
    <div class="card" role="dialog" data-i18n-aria-label="promptLabel">
      <p class="text" data-i18n="promptText"></p>

      </div>
    </div>
    <script type="module" src="prompt.js"></script>
  </body>
</html>
